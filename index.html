<style>

.panel{background:#fff;border:1.5px solid #9aa5a0;border-radius:10px;padding:14px 16px;margin:12px 0}

input[type=text],select{font:inherit;padding:6px 8px;border:1.5px solid #9aa5a0;border-radius:6px;background:#fff}

.card{width:var(--cw);aspect-ratio:5/7;background:#fff;border:1.5px solid #8a8a8a;border-radius:8px;padding:5px;display:flex;flex-direction:column;align-items:center;font-family:Helvetica,Arial,sans-serif;flex:none;user-select:none}
.card b{white-space:nowrap;font-size:calc(var(--cw)*.13);margin:2px 0}
.card svg{width:100%;flex:1;min-height:0}
.ie{display:flex;flex-direction:column;font-size:calc(var(--cw)*.09);font-weight:bold;line-height:1.2;align-self:flex-start;padding-left:4px}
.ie .b{color:var(--blue)}.ie .o{color:var(--orange)}

.cube{--h:40px;width:80px;height:80px;position:relative;transform-style:preserve-3d;transform:rotateX(var(--x)) rotateY(var(--y))}
.cube.roll{animation:tumble .95s cubic-bezier(.2,.7,.3,1)}
@keyframes tumble{from{transform:rotateX(calc(var(--x) + 900deg)) rotateY(calc(var(--y) + 1260deg)) rotateZ(240deg)}to{transform:rotateX(var(--x)) rotateY(var(--y)) rotateZ(0)}}
.face{position:absolute;inset:0;background:#fff;border:2px solid var(--navy);border-radius:12px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:10px;backface-visibility:hidden}

#die.go,.pile.go{animation:pulse 1s infinite}

@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(31,111,209,.35)}}

.msg{text-align:center;min-height:3.2em}

@keyframes drain{to{width:0}}

<style>

<script>
// ---------- cards ----------
const C=[];[1,-1,.5,-.5,2,-2].forEach(m=>C.push({m,c:0}));C.push({m:0,c:0},{v:0});
[3,-3,6,-6,12,-12].forEach(k=>C.push({m:0,c:k},{v:k}));
[[3,[1,-1,.5,-.5]],[6,[2,-2,1,-1,.5,-.5]],[12,[2,-2]]].forEach(([k,ms])=>ms.forEach(m=>C.push({m,c:k},{m,c:-k})));
const f=n=>String(n).replace('-','−');
const iv=n=>n==null?'none':n==='any'?'any':f(n);
const eq=c=>c.v!==undefined?'x = '+f(c.v):c.m===0?'y = '+f(c.c):'y = '+(c.m===1?'':c.m===-1?'−':f(c.m))+'x'+(c.c?(c.c>0?' + ':' − ')+Math.abs(c.c):'');
const yi=c=>c.v!==undefined?(c.v===0?'any':null):c.c;
const xi=c=>c.v!==undefined?c.v:(c.m===0?(c.c===0?'any':null):(-c.c/c.m)+0);
const sl=c=>c.v!==undefined?Infinity:c.m;
const same=(a,b)=>a!==null&&b!==null&&(a==='any'||b==='any'||a===b);
function match(r,a,b){a=C[a];b=C[b];const s=sl(a),t=sl(b);
 if(r===2)return s===t;
 if(r===3)return (s===Infinity&&t===0)||(s===0&&t===Infinity)||s*t===-1;
 if(r===4)return same(yi(a),yi(b));
 if(r===5)return same(xi(a),xi(b));
 return true}
const REQ={1:["Draw!","The player takes a card from the draw pile. Their turn is then over."],2:["Parallel.","Play a line parallel to the top card (they never meet)."],3:["Perpendicular.","Play a line that crosses the top card at a right angle."],4:["Same y-intercept.","Play a line that crosses the y-axis at the same point as the top card."],5:["Same x-intercept.","Play a line that crosses the x-axis at the same point as the top card."],6:["Discard!","Choose any card from your hand and put it on the discard pile."]};
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const FACE={1:[0,0],2:[0,-90],3:[-90,0],4:[90,0],5:[0,90],6:[0,180]};
const FN=[[1,''],[6,'rotateY(180deg) '],[2,'rotateY(90deg) '],[5,'rotateY(-90deg) '],[3,'rotateX(90deg) '],[4,'rotateX(-90deg) ']];
const dieH=(n,anim)=>{const [x,y]=FACE[n||3];return `<div class="scene"><div class="tilt"><div class="cube${anim?' roll':''}" style="--x:${x}deg;--y:${y}deg">${FN.map(([k,t])=>`<div class="face" style="transform:${t}translateZ(40px)">${[0,1,2,3,4,5,6,7,8].map(i=>PIPS[k].includes(i)?'<i></i>':'<b></b>').join('')}</div>`).join('')}</div></div></div>`};
function gfx(c,easy){const X=v=>50+v*3.4,Y=v=>50-v*3.4;let s='<svg viewBox="0 0 100 100">';
 for(let i=-12;i<=12;i+=3){s+=`<path d="M${X(i)} ${Y(-12)}V${Y(12)}M${X(-12)} ${Y(i)}H${X(12)}" stroke="#ddd" stroke-width=".4"/>`;
  if(i)s+=`<text x="${X(i)}" y="${Y(0)+4.2}" font-size="3.2" text-anchor="middle" fill="#444">${f(i)}</text><text x="${X(0)-1.2}" y="${Y(i)+1.1}" font-size="3.2" text-anchor="end" fill="#444">${f(i)}</text>`}
 s+=`<path d="M${X(-12)} ${Y(0)}H${X(12)}M${X(0)} ${Y(-12)}V${Y(12)}" stroke="#333" stroke-width=".8"/><text x="95" y="${Y(0)+1.2}" font-size="4" fill="#333">x</text><text x="${X(0)+2}" y="6" font-size="4" fill="#333">y</text>`;
 let a,b;if(c.v!==undefined){a=[c.v,-12];b=[c.v,12]}else{let lo=-12,hi=12;if(c.m){const p=(-12-c.c)/c.m,q=(12-c.c)/c.m;lo=Math.max(lo,Math.min(p,q));hi=Math.min(hi,Math.max(p,q))}a=[lo,c.m*lo+c.c];b=[hi,c.m*hi+c.c]}
 s+=`<path d="M${X(a[0])} ${Y(a[1])}L${X(b[0])} ${Y(b[1])}" stroke="#c0392b" stroke-width="1.4" stroke-linecap="round"/>`;
 if(easy){const x=xi(c),y=yi(c);if(typeof x==='number')s+=`<circle cx="${X(x)}" cy="${Y(0)}" r="2.6" fill="#e8820c"/>`;if(typeof y==='number')s+=`<circle cx="${X(0)}" cy="${Y(y)}" r="${x===0?1.6:2.6}" fill="#1f6fd1"/>`}
 return s+'</svg>'}
const fs=t=>Math.min(.15,.82/[...t].reduce((a,h)=>a+(h===' '||h==='.'?.28:.6),0));
const cardH=(id,easy,cls='')=>{const c=C[id];return `<div class="card ${cls}" data-c="${id}"><b style="font-size:calc(var(--cw)*${fs(eq(c))})">${eq(c)}</b>${gfx(c,easy)}${easy?`<div class="ie"><span class="b">y-int: ${iv(yi(c))}</span><span class="o">x-int: ${iv(xi(c))}</span></div>`:''}</div>`};
const back=easy=>`<div class="card back">Rise &amp; Run${easy?'<small>EASY MODE</small>':''}</div>`;
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const $=s=>document.querySelector(s),app=$('#app');

// ---------- host-side game engine ----------
let G=null,hostPid=0,isHost=false,mq=null,conn=null,lob=[],cfg={},hcode='',V=null,sel=null,key='',lastRn=0,rolling=false,hint=false,dismissed=false;
function newGame(list){const d=shuf(C.map((_,i)=>i)),pl=shuf(list.slice());
 pl.forEach((p,i)=>{p.id=i;p.hand=d.splice(0,5);if(p.host)hostPid=i});
 G={players:pl,draw:d,disc:[d.pop()],turn:0,phase:'roll',die:null,pend:null,winner:null,rn:0,seq:0,timer:null,easy:cfg.easy,chal:cfg.chal,delay:cfg.delay,
  msg:'Players are in random order. '+pl[0].name+' goes first.'};push()}
const topC=()=>G.disc[G.disc.length-1];
const okc=c=>G.die===6||match(G.die,c,topC());
function draw(P){if(!G.draw.length){const t=G.disc.pop();G.draw=shuf(G.disc);G.disc=[t]}if(G.draw.length)P.hand.push(G.draw.pop())}
function end(){if(G.players[G.turn].hand.length===0){G.winner=G.turn;G.phase='over';return}G.turn=(G.turn+1)%G.players.length;G.phase='roll'}
function act(pid,a){if(!G||G.winner!==null)return;const P=G.players[pid];if(!P)return;
 if(a.t==='roll'&&G.turn===pid&&G.phase==='roll'){G.die=1+Math.random()*6|0;G.rn++;G.msg='';G.phase=G.die===1?'draw':'play'}
 else if(a.t==='draw'&&G.turn===pid&&G.phase==='draw'){draw(P);G.msg=P.name+' rolled a 1 and drew a card.';end()}
 else if(a.t==='pass'&&G.turn===pid&&G.phase==='play'&&G.die<6){G.msg=P.name+' has no match and ends the turn.';end()}
 else if(a.t==='play'&&G.turn===pid&&G.phase==='play'&&P.hand.includes(a.c)){
  const prev=topC(),good=okc(a.c);if(!good&&!G.chal)return;
  P.hand.splice(P.hand.indexOf(a.c),1);G.disc.push(a.c);
  if(G.chal&&G.die<6){G.phase='chal';G.pend={p:pid,card:a.c,prev,die:G.die,good,end:Date.now()+G.delay*1000};G.msg=P.name+' played a card. Does it match? Challenge it!';
   G.timer={ms:G.delay*1000,fn:()=>{G.pend=null;G.msg='';end()}}}
  else{G.msg=P.name+(G.die===6?' discarded a card.':' played a card.');end()}}
 else if(a.t==='chal'&&G.phase==='chal'&&pid!==G.pend.p){const pp=G.players[G.pend.p];
  if(!G.pend.good){G.disc.pop();pp.hand.push(G.pend.card);draw(pp);G.msg=P.name+' challenged and was right! '+pp.name+' takes the card back and draws one.'}
  else{draw(P);G.msg=P.name+' challenged, but the card matched. '+P.name+' draws a card.'}
  G.pend=null;G.timer=null;end()}
 else return;
 push()}
function view(pid){return{you:pid,pl:G.players.map(p=>({n:p.name,k:p.hand.length,bot:p.bot})),hand:G.players[pid].hand,top:topC(),dn:G.disc.length,drn:G.draw.length,turn:G.turn,phase:G.phase,die:G.die,rn:G.rn,msg:G.msg,winner:G.winner,easy:G.easy,chal:G.chal,
 pend:G.pend&&{p:G.pend.p,prev:G.pend.prev,rem:Math.max(0,G.pend.end-Date.now())}}}
function push(){G.seq++;const s=G.seq,T=G.timer;G.timer=null;
 if(T)setTimeout(()=>{if(G.seq===s){T.fn();push()}},T.ms);
 G.players.forEach(p=>{if(p.conn&&p.conn.open)p.conn.send({t:'v',v:view(p.id)})});
 show(view(hostPid));bots(s)}
function bots(s){if(G.winner!==null)return;const t=G.players[G.turn],go=(ms,fn)=>setTimeout(()=>{if(G.seq===s)fn()},ms);
 if(t.bot&&G.phase==='roll')go(1800,()=>act(G.turn,{t:'roll'}));
 if(t.bot&&G.phase==='draw')go(2400,()=>act(G.turn,{t:'draw'}));
 if(t.bot&&G.phase==='play')go(1400,()=>{const c=G.die===6?t.hand[Math.random()*t.hand.length|0]:t.hand.find(okc);c!==undefined?act(G.turn,{t:'play',c}):act(G.turn,{t:'pass'})});
 if(G.phase==='chal'&&!G.pend.good)G.players.forEach(p=>{if(p.bot&&p.id!==G.pend.p&&Math.random()<.8)go(700+Math.random()*Math.max(0,G.delay*1000-1500),()=>act(p.id,{t:'chal'}))})}
const send=a=>isHost?act(hostPid,a):conn&&conn.send(a);

// ---------- screens ----------
function setup(){app.innerHTML=`<h1>Rise <i>&amp;</i> Run</h1><p class="sub">A card game about straight lines. 2–6 players.</p>
<div class="panel"><label>Your name <input type="text" id="nm" maxlength="16" value="Player"></label>
<label><input type="radio" name="dk" value="std" checked> Standard deck (read the intercepts off the graph)</label>
<label><input type="radio" name="dk" value="easy"> Easy mode deck (intercepts shown on each card)</label>
<label><input type="checkbox" id="ch"> Challenge mode: any card can be played, but others may challenge it</label>
<label id="dlw" hidden>Time to challenge <select id="dl"><option>3</option><option selected>5</option><option>8</option><option>12</option></select> seconds</label>
<label>Computer players <select id="bt"><option>0</option><option selected>1</option><option>2</option><option>3</option><option>4</option></select></label>
<div class="row"><button id="solo">Play against the computer</button><button class="alt" id="host">Host a game for friends</button></div></div>
<div class="panel"><b>Join a friend’s game</b><div class="row"><input type="text" id="jc" class="codein" maxlength="4" placeholder="4-digit code" inputmode="numeric" autocomplete="off"><button class="alt" id="jn">Join</button></div></div>
<div class="panel"><b>Make your own physical game</b><div class="row"><a href="rise_and_run_rules.pdf" download>Rules (PDF)</a><a href="rise_and_run_cards.pdf" download>Standard cards (PDF)</a><a href="rise_and_run_cards_easy_mode.pdf" download>Easy mode cards (PDF)</a></div></div>`;
 const rd=()=>({name:$('#nm').value.trim()||'Player',easy:document.querySelector('[name=dk]:checked').value==='easy',chal:$('#ch').checked,delay:+$('#dl').value,bots:+$('#bt').value});
 $('#ch').onchange=e=>$('#dlw').hidden=!e.target.checked;
 $('#solo').onclick=()=>{cfg=rd();isHost=true;const n=Math.max(1,Math.min(5,cfg.bots));newGame([{name:cfg.name,host:true},...Array.from({length:n},(_,i)=>({name:'Computer '+(i+1),bot:true}))])};
 $('#host').onclick=()=>{cfg=rd();hostGame()};
 $('#jn').onclick=()=>/^\d{4}$/.test($('#jc').value)?joinGame($('#jc').value,rd().name):alert('Enter the 4-digit code.')}
function joinScreen(code){app.innerHTML=`<h1>Rise <i>&amp;</i> Run</h1><div class="panel"><b>Join game ${code}</b><label>Your name <input type="text" id="nm" maxlength="16" value="Player"></label><button id="jn">Join game</button></div>`;
 $('#jn').onclick=()=>joinGame(code,$('#nm').value.trim()||'Player')}
function lobbyUI(){const link=location.href.split('#')[0]+'#join='+hcode,names=[cfg.name,...lob.map(c=>c.pname)];
 app.innerHTML=`<h1>Rise <i>&amp;</i> Run</h1><div class="panel"><p>Share this code or link:</p><div class="code">${hcode}</div><p><a href="${link}">${link}</a></p><button class="alt" id="cp">Copy link</button></div>
 <div class="panel"><b>Players</b><ul>${names.map(n=>`<li>${esc(n)}</li>`).join('')}${cfg.bots?`<li>+ ${cfg.bots} computer player${cfg.bots>1?'s':''}</li>`:''}</ul><button id="go" ${names.length+cfg.bots<2?'disabled':''}>Start game</button></div>`;
 $('#cp').onclick=()=>navigator.clipboard&&navigator.clipboard.writeText(link);
 $('#go').onclick=()=>newGame([{name:cfg.name,host:true},...lob.map(c=>({name:c.pname,conn:c})),...Array.from({length:cfg.bots},(_,i)=>({name:'Computer '+(i+1),bot:true}))])}
const bcast=()=>lob.forEach(c=>c.send({t:'lobby',names:[cfg.name,...lob.map(x=>x.pname)]}));
// ---------- networking: MQTT over secure WebSocket (works through most school firewalls) ----------
// Each room uses its own topics. The host listens on <room>/host; each player listens on <room>/<their id>.
const BROKER='wss://broker.emqx.io:8084/mqtt',NS='riserun-v1/',rnd=()=>Math.random().toString(36).slice(2,8);
const fail=m=>{alert(m);location.hash='';location.reload()};
function hostGame(){isHost=true;lob=[];const code=String(1000+Math.random()*9000|0),base=NS+code+'/',cons={};let started=false,live=false,taken=false;
 if(mq)mq.end(true);
 // a retained "alive" message marks a room as in use; clearing it is the last-will message if the host vanishes
 mq=mqtt.connect(BROKER,{clientId:'rr_h_'+rnd(),clean:true,connectTimeout:8000,keepalive:30,will:{topic:base+'alive',payload:'',retain:true,qos:0}});
 const me=mq,pub=(t,x)=>me.publish(t,JSON.stringify(x));
 const guard=setTimeout(()=>{if(!started)fail('Could not reach the game server. Your network may be blocking it.')},12000);
 me.on('connect',()=>{
  if(started){me.publish(base+'alive','1',{retain:true});return}
  started=true;clearTimeout(guard);
  me.subscribe(base+'alive',()=>setTimeout(()=>{
   if(taken){me.end(true);hostGame();return}
   live=true;me.publish(base+'alive','1',{retain:true});me.subscribe(base+'host');hcode=code;lobbyUI()},1200))});
 me.on('message',(t,p)=>{
  if(t===base+'alive'){if(!live)taken=p.length>0;return}
  let m;try{m=JSON.parse(p.toString())}catch(e){return}
  const id=String(m.from||''),d=m.d||{};if(!id)return;let cn=cons[id];
  if(d.t==='hello'){
   if(!G){
    if(!cn){if(lob.length+1+cfg.bots>=6){pub(base+id,{t:'full'});return}
     cn=cons[id]={id,open:true,send:x=>pub(base+id,x)};lob.push(cn)}
    cn.pname=String(d.name||'Player').slice(0,16);lobbyUI();bcast()}
   else if(cn){const p=G.players.find(p=>p.conn===cn);if(p)cn.send({t:'v',v:view(p.id)})}
   return}
  if(!cn)return;
  if(d.t==='bye'){delete cons[id];
   if(!G){lob=lob.filter(x=>x!==cn);lobbyUI();bcast()}
   else{const p=G.players.find(p=>p.conn===cn);if(p){p.bot=true;p.conn=null;push()}}
   return}
  if(G){const p=G.players.find(p=>p.conn===cn);if(p)act(p.id,d)}});
 me.on('error',()=>{})}
function joinGame(code,name){isHost=false;app.innerHTML='<p>Connecting…</p>';
 const base=NS+code+'/',id='p'+rnd();let got=false,tries=0,warned=false;
 if(mq)mq.end(true);
 mq=mqtt.connect(BROKER,{clientId:'rr_'+id,clean:true,connectTimeout:8000,keepalive:30,will:{topic:base+'host',payload:JSON.stringify({from:id,d:{t:'bye'}}),qos:0}});
 const me=mq,send=x=>me.publish(base+'host',JSON.stringify({from:id,d:x})),hello=()=>send({t:'hello',name});
 conn={send};
 me.on('connect',()=>{warned=false;me.subscribe([base+id,base+'alive'],()=>{if(!got)hello()})});
 // keep knocking until the host answers; give up after about 15 seconds
 const tm=setInterval(()=>{if(got){clearInterval(tm);return}
  if(++tries>=5){clearInterval(tm);fail(me.connected?'Game not found. Check the code.':'Could not reach the game server. Your network may be blocking it.');return}
  if(me.connected)hello()},3000);
 me.on('message',(t,p)=>{
  if(t===base+'alive'){if(!p.length&&got&&!warned){warned=true;app.insertAdjacentHTML('afterbegin','<p class="warn">Disconnected from the host.</p>')}return}
  let d;try{d=JSON.parse(p.toString())}catch(e){return}
  if(d.t==='full'){clearInterval(tm);fail('That game is full.');return}
  got=true;
  if(d.t==='lobby')app.innerHTML=`<h1>Rise <i>&amp;</i> Run</h1><div class="panel"><b>Waiting for the host to start</b><ul>${d.names.map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`;
  if(d.t==='v')show(d.v)});
 me.on('close',()=>{if(got&&!warned){warned=true;app.insertAdjacentHTML('afterbegin','<p class="warn">Disconnected from the host.</p>')}});
 me.on('error',()=>{})}

// ---------- game screen ----------
function winH(v){const me=v.winner===v.you,cols=['#b8902f','#1b2f4a','#e8820c','#1f6fd1','#c0392b','#2e9e5b'];
 const conf=Array.from({length:70},()=>`<span style="left:${Math.random()*100}%;background:${cols[Math.random()*6|0]};animation-delay:${Math.random()*2.5}s;animation-duration:${3+Math.random()*3}s;transform:rotate(${Math.random()*360}deg)"></span>`).join('');
 return `<div class="win" role="dialog" aria-label="Game over"><div class="confetti">${conf}</div><div class="wbox"><div class="trophy">🏆</div><h2>${me?'You win!':esc(v.pl[v.winner].n)+' wins!'}</h2><p>${me?'You played your last card. Brilliant!':'They played their last card. You had '+v.hand.length+' card'+(v.hand.length==1?'':'s')+' left.'}</p><div class="row" style="justify-content:center"><button id="again2">Back to menu</button><button class="alt" id="view">View table</button></div></div></div>`}
function show(v){V=v;const my=v.turn===v.you,ph=v.phase,k=v.turn+ph;
 if(k!==key){sel=null;hint=false;key=k}if(!v.hand.includes(sel))sel=null;
 const fresh=v.rn&&v.rn!==lastRn;if(fresh){lastRn=v.rn;rolling=true;setTimeout(()=>{rolling=false;show(V)},1000)}
 const nm=i=>esc(v.pl[i].n),R=REQ[v.die]||['',''],canPlay=my&&ph==='play'&&!rolling,canDraw=my&&ph==='draw'&&!rolling;
 const fits=c=>v.die===6||match(v.die,c,v.top),bad=canPlay&&sel!==null&&!fits(sel);
 let say='';
 if(ph==='over')say=`<b>${nm(v.winner)} wins!</b>`;
 else if(ph==='roll')say=my?'Your turn. Click the die to roll.':`Waiting for ${nm(v.turn)} to roll…`;
 else if(canPlay){say=sel===null?(v.die===6?'Choose a card to discard.':'Choose a card that fits. Click a card to check it.'):v.die===6?'Click the card again to discard it.':bad?`<span class="warn">This card doesn’t match. ${v.chal?'You can still play it by clicking it again, but others may challenge you.':'Choose a different card.'}</span>`:'✓ This card matches. Click it again to play it.';
  if(hint&&v.die<6)say+='<br>'+(v.hand.some(fits)?'Matching cards are outlined in green.':'None of your cards match. End your turn.')}
 else if(canDraw)say='Click the draw pile to take a card.';
 else if(!rolling&&(ph==='play'||ph==='draw'))say=`${nm(v.turn)} is thinking…`;
 const rule=v.die&&['play','draw','chal'].includes(ph)&&!rolling?`<div class="rule"><b>Rolled ${v.die}: ${R[0]}</b> ${R[1]}</div>`:'';
 let h=`<div class="order">${v.pl.map((p,i)=>`<span class="chip ${i===v.turn&&ph!=='over'?'turn':''}">${esc(p.n)}${i===v.you?' (you)':''}${p.bot?' 🤖':''}: ${p.k}</span>`).join('')}</div>
 <div class="table"><figure><div id="pile" class="pile ${canDraw?'go':''}">${back(v.easy)}</div><br>Draw pile: ${v.drn}${canDraw?'<br><b>Click to draw</b>':''}</figure>
 <figure>${cardH(v.top,v.easy)}Top of discard pile (${v.dn})</figure>
 ${v.pend?`<figure>${cardH(v.pend.prev,v.easy,'small')}It was played on this</figure>`:''}
 <figure><button id="die" class="${my&&ph==='roll'?'go':''}" ${my&&ph==='roll'?'':'disabled'} aria-label="Roll the die">${dieH(v.die,fresh)}</button></figure></div>
 <div class="msg">${rule}${v.msg?esc(v.msg)+'<br>':''}${say}</div>`;
 if(ph==='chal'){h+=`<div class="bar"><i style="animation-duration:${v.pend.rem}ms"></i></div>`;if(v.pend.p!==v.you)h+=`<div class="row" style="justify-content:center"><button id="ch" style="background:var(--red);border-color:var(--red)">Challenge!</button></div>`}
 if(canPlay&&v.die<6)h+=`<div class="row" style="justify-content:center"><button class="alt" id="hn">Show me a match</button><button class="alt" id="ps">No match: end my turn</button></div>`;
 if(ph==='over')h+=`<div class="row" style="justify-content:center"><button id="again">Back to menu</button></div>`;
 h+=`<div class="hand">${v.hand.map(c=>cardH(c,v.easy,(c===sel?'sel ':'')+(hint&&canPlay&&v.die<6&&fits(c)?'hint':''))).join('')}</div>`;
 app.innerHTML=h;
 if(ph==='over'&&!dismissed)app.insertAdjacentHTML('beforeend',winH(v));
 const g=id=>document.getElementById(id);
 if(g('die'))g('die').onclick=()=>send({t:'roll'});
 if(canDraw)g('pile').onclick=()=>send({t:'draw'});
 if(g('hn'))g('hn').onclick=()=>{hint=true;show(V)};
 if(g('ps'))g('ps').onclick=()=>send({t:'pass'});
 if(g('ch'))g('ch').onclick=()=>send({t:'chal'});
 if(g('view'))g('view').onclick=()=>{dismissed=true;show(V)};
 if(g('again2'))g('again2').onclick=()=>{location.hash='';location.reload()};
 if(g('again'))g('again').onclick=()=>{location.hash='';location.reload()};
 app.querySelectorAll('.hand .card').forEach(el=>el.onclick=()=>{if(!canPlay)return;const c=+el.dataset.c;if(sel===c){if(!bad||v.chal)send({t:'play',c});return}sel=c;show(V)})}

const m=location.hash.match(/join=(\d{4})/);m?joinScreen(m[1]):setup();
</script>
